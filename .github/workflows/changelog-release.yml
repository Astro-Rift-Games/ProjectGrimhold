# Publishes player notes when a GitHub Release is published for a vX.Y.Z tag on New-Testing:
# regenerates every changelog file, commits them to New-Testing, replaces the release body
# with the player notes and attaches changelog-players.json. Safe to re-run.
name: Changelog release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: changelog-New-Testing
  cancel-in-progress: false

jobs:
  publish-player-notes:
    name: Publish player notes
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must match vX.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: New-Testing
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools/changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the tag belongs to New-Testing
        run: |
          git fetch --quiet --tags origin
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/New-Testing; then
            echo "::error::Tag $TAG does not point to a commit on New-Testing."
            exit 1
          fi

      - name: Validate player notes of this release
        run: node tools/changelog/src/cli.js release-notes --tag "$TAG" --strict > /dev/null

      - name: Regenerate and push all changelog files
        run: >
          bash tools/changelog/scripts/publish.sh New-Testing
          "chore(changelog): publish changelogs for $TAG [skip ci]"

      - name: Update the GitHub Release
        run: |
          node tools/changelog/src/cli.js release-notes --tag "$TAG" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
          gh release upload "$TAG" changelog-players.json --clobber
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
