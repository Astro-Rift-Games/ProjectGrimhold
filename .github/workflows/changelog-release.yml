# Compatibility entry point: read-only audit, never a second publisher.
name: Changelog release audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check versioned changelogs on main
        run: node tools/changelog/src/cli.js check --ref main --strict
      - name: Publication ownership
        run: echo 'Use weekly-release.yml. This audit does not publish or push.' >> "$GITHUB_STEP_SUMMARY"